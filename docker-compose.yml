version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: job_ingestion_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: job_ingestion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_ingestion"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_ingestion_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:root@postgres:5432/job_ingestion
      PYTHON_ORG_REQUESTS_PER_MINUTE: 20
      PYTHON_ORG_MIN_REQUEST_INTERVAL: 1.5
      PYTHON_ORG_MAX_PAGES: 3
      MUSE_REQUESTS_PER_MINUTE: 30
      MUSE_MIN_REQUEST_INTERVAL: 1.0
      MUSE_MAX_PAGES: 3
      REQUEST_TIMEOUT_SECONDS: 12.0
      MAX_RETRIES: 3
      BACKOFF_BASE_SECONDS: 2.0
      INGESTION_INTERVAL_MINUTES: 5
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job_ingestion_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
